<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Egor Loy</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 2rem 1.5rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      background-color: #ffffff;
      color: #111111;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #eeeeee;
      }
      a {
        color: #64b5f6;
      }
      footer {
        color: #888888;
      }
    }
    main {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin: 0 0 1rem 0;
    }
    p {
      font-size: 1.125rem;
      line-height: 1.5;
      margin: 0 0 1rem 0;
    }
    a {
      color: #1a73e8;
      text-decoration: underline;
    }
    footer {
      max-width: 600px;
      margin: 2rem auto 0 auto;
      width: 100%;
      font-size: 0.875rem;
      color: #666666;
    }
  </style>
</head>
<body>
  <main>
    <h1>Egor Loy</h1>
    <p>Software engineering and AI tooling.</p>
    <p><a href="mailto:egor@loyegor.com">egor@loyegor.com</a></p>
  </main>
  <footer>
    <p>© 2026 Egor Loy</p>
  </footer>
</body>
</html>
